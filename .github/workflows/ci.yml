name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  flake-check:
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABELS || '["self-hosted","Linux","X64","monarchic-local","nixos"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v14
      - name: Check flake
        run: nix flake check
